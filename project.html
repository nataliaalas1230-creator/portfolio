<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project — Natalia Alas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Alegreya+Sans:wght@400;500&family=Xanh+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #050505; --text: #f2f2f2; --muted: #8c8c8c; --line: #262626;
    --pill: #f2f2f2; --pill-text: #050505;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Alegreya Sans", Georgia, sans-serif; font-size: 17px; line-height: 1.4;
    -webkit-font-smoothing: antialiased; overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  a:hover { opacity: 0.55; }
  .caps { font-size: 13px; text-transform: uppercase; letter-spacing: 0.02em; line-height: 1.35; }
  .label { font-size: 13px; color: var(--muted); }
  .pad { padding-left: 24px; padding-right: 24px; }
  .serif { font-family: Marcellus, Georgia, serif; font-weight: 400; text-transform: uppercase; letter-spacing: 0.01em; }
  .mono {
    font-family: "Xanh Mono", "Courier New", monospace; text-transform: uppercase;
    font-size: clamp(0.95rem, 1.4vw, 1.1rem); line-height: 1.45; letter-spacing: 0.01em;
  }

  .top { display: flex; justify-content: space-between; padding-top: 24px; }
  .top ul { list-style: none; text-align: right; }

  /* Header */
  .head { padding-top: 22vh; padding-bottom: 72px; }
  .count { font-size: 13px; font-variant-numeric: tabular-nums; }
  .head h1 { font-size: clamp(3rem, 11vw, 11rem); line-height: 0.9; margin-top: 16px; }
  .head h1 .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 0.04em; }
  .head h1 .w span { display: inline-block; transform: translateY(105%); animation: rise 1s cubic-bezier(.2,.8,.2,1) forwards; }
  @keyframes rise { to { transform: none; } }
  .meta { display: grid; grid-template-columns: repeat(2, 1fr); gap: 24px; margin-top: 64px; max-width: 900px; }
  .meta ul { list-style: none; margin-top: 6px; }
  .intro { margin-top: 48px; max-width: 900px; }
  .intro .mono { margin-top: 8px; }
  .fade { opacity: 0; animation: fade 1s ease forwards 0.6s; }
  @keyframes fade { to { opacity: 1; } }

  /* Sections */
  section.block { border-top: 1px solid var(--line); padding-top: 32px; padding-bottom: 96px; }
  .block-head { display: grid; grid-template-columns: 56px 1fr; gap: 0 16px; }
  .block-head .num { font-size: 13px; color: var(--muted); padding-top: 0.6em; font-variant-numeric: tabular-nums; }
  .block-head h2 { font-size: clamp(1.75rem, 4.2vw, 3.5rem); line-height: 1; }
  .block-head .mono { grid-column: 2; margin-top: 18px; max-width: 820px; }
  .block .counter { margin-top: 40px; font-size: 13px; font-variant-numeric: tabular-nums; }

  /* slides: swipeable row like the homepage */
  .slides {
    display: flex; gap: 8px; margin-top: 14px; overflow-x: auto; scroll-snap-type: x mandatory;
    scrollbar-width: none; padding: 0 24px; scroll-padding: 0 24px; cursor: grab;
  }
  .slides::-webkit-scrollbar { display: none; }
  .slides img {
    height: clamp(300px, 72vh, 760px); width: auto; flex: none; scroll-snap-align: start;
    background: #111; display: block; user-select: none; -webkit-user-drag: none;
  }
  .arrows { display: flex; gap: 8px; }
  .arrows button {
    width: 44px; height: 44px; border: 1px solid var(--line); background: none; color: var(--text);
    font: inherit; font-size: 18px; cursor: pointer; border-radius: 0;
  }
  .arrows button:hover { border-color: var(--text); }
  .gallery-bar { display: flex; justify-content: space-between; align-items: end; margin-top: 40px; }
  .gallery-bar .counter { margin-top: 0; }

  /* columns: long emails side by side */
  .columns { display: grid; gap: 12px; margin-top: 40px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 260px), 1fr)); align-items: start; }
  .columns img { width: 100%; height: auto; display: block; background: #111; }

  /* stack: banners at their real size */
  .stack { display: flex; flex-wrap: wrap; gap: 24px; justify-content: center; align-items: center; margin-top: 40px; }
  .stack img { max-width: 100%; height: auto; display: block; }
  .stack.wide img { width: 100%; }

  /* Next project */
  .next { display: block; border-top: 1px solid var(--line); padding-top: 32px; padding-bottom: 160px; }
  .next:hover { opacity: 1; }
  .next h2 { font-size: clamp(3rem, 12vw, 12rem); line-height: 0.9; margin-top: 16px; transition: transform 0.5s cubic-bezier(.2,.8,.2,1); }
  .next:hover h2 { transform: translateX(2vw); }

  /* Menu pill + overlay (same as homepage) */
  .menu-pill {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 30;
    background: var(--pill); color: var(--pill-text); border: 0; cursor: pointer;
    width: 172px; height: 52px; font: inherit; font-size: 13px; text-transform: uppercase; letter-spacing: 0.04em;
  }
  .overlay {
    position: fixed; inset: 0; z-index: 25; background: var(--bg);
    display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 4px;
    opacity: 0; visibility: hidden; transition: opacity 0.4s ease, visibility 0.4s;
  }
  .menu-open .overlay { opacity: 1; visibility: visible; }
  .overlay a { font-family: Marcellus, Georgia, serif; text-transform: uppercase; letter-spacing: 0.01em; font-size: clamp(2.5rem, 8vw, 5rem); line-height: 1.1; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--text); outline-offset: 4px; }

  @media (max-width: 600px) {
    .block-head { grid-template-columns: 1fr; }
    .block-head .num { padding-top: 0; margin-bottom: 8px; }
    .block-head .mono { grid-column: 1; }
    .head { padding-top: 16vh; }
    /* On phones, every image fits the screen width with the next one peeking in */
    .slides { align-items: center; }
    .slides img { height: auto; width: 84vw; max-height: 72vh; object-fit: contain; background: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .head h1 .w span, .fade { animation: none; transform: none; opacity: 1; }
    .overlay, .next h2 { transition: none; }
  }
</style>
</head>
<body>
<div class="top pad caps">
  <a href="index.html">Natalia Alas<br>← All Work</a>
  <ul>
    <li><a href="index.html#work">Work</a></li>
    <li><a href="index.html#about">About</a></li>
    <li><a href="files/natalia-alas-resume-2026.pdf">Resume</a></li>
    <li><a href="index.html#contact">Contact</a></li>
  </ul>
</div>

<main id="page"></main>

<button class="menu-pill" aria-expanded="false">Menu</button>
<nav class="overlay" aria-hidden="true">
  <a href="index.html">Home</a>
  <a href="index.html#work">Work</a>
  <a href="index.html#about">About</a>
  <a href="index.html#contact">Contact</a>
</nav>

<script src="data.js"></script>
<script>
  const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
  const pad = n => String(n).padStart(2, '0');
  const slug = new URLSearchParams(location.search).get('p');
  const index = Math.max(0, PROJECTS.findIndex(p => p.slug === slug));
  const p = PROJECTS[index];
  const next = PROJECTS[(index + 1) % PROJECTS.length];
  document.title = `${p.title} — Natalia Alas`;

  const titleHTML = p.title.split(' ').map((word, i) =>
    `<span class="w"><span style="animation-delay:${0.1 + i * 0.08}s">${esc(word)}</span></span>`).join(' ');

  const gallery = (s, n) => {
    const alt = i => `${esc(p.title)}${s.title ? ' — ' + esc(s.title) : ''}, image ${i + 1}`;
    if (s.layout === 'columns') {
      return `<div class="columns pad">${s.imgs.map((src, i) =>
        `<img loading="lazy" alt="${alt(i)}" src="${CDN}${src}">`).join('')}</div>`;
    }
    if (s.layout === 'stack') {
      const wide = s.imgs.length === 1 ? ' wide' : '';
      return `<div class="stack pad${wide}">${s.imgs.map((src, i) =>
        `<img loading="lazy" alt="${alt(i)}" src="${CDN}${src}">`).join("")}</div>`;
    }
    return `
      <div class="gallery-bar pad">
        <p class="counter"><span class="cur">01</span> / ${pad(s.imgs.length)}</p>
        <div class="arrows"><button class="prev" aria-label="Previous image">←</button><button class="nxt" aria-label="Next image">→</button></div>
      </div>
      <div class="slides" tabindex="0" aria-label="${esc(s.title || p.title)} images">
        ${s.imgs.map((src, i) => `<img loading="lazy" draggable="false" alt="${alt(i)}" src="${CDN}${src}">`).join('')}
      </div>`;
  };

  document.getElementById('page').innerHTML = `
    <header class="head pad">
      <p class="count">${pad(index + 1)} / ${pad(PROJECTS.length)}</p>
      <h1 class="serif">${titleHTML}</h1>
      <div class="meta fade">
        <div><p class="label">Year</p><ul><li>${esc(p.year)}</li></ul></div>
        <div><p class="label">Creative Fields</p><ul>${p.fields.map(f => `<li>${esc(f)}</li>`).join('')}</ul></div>
      </div>
      <div class="intro fade"><p class="label">About</p><p class="mono">${esc(p.intro)}</p></div>
    </header>
    ${p.sections.map((s, n) => `
      <section class="block">
        ${s.title || s.text ? `
        <div class="block-head pad">
          <span class="num">${pad(n + 1)}</span>
          ${s.title ? `<h2 class="serif">${esc(s.title)}</h2>` : '<span></span>'}
          ${s.text ? `<p class="mono">${esc(s.text)}</p>` : ''}
        </div>` : ''}
        ${gallery(s, n)}
      </section>`).join('')}
    <a class="next pad" href="project.html?p=${next.slug}">
      <p class="label">Next Project →</p>
      <h2 class="serif">${esc(next.title)}</h2>
    </a>`;

  // Swipeable galleries: counter, arrows and mouse drag
  document.querySelectorAll('.block').forEach(block => {
    const track = block.querySelector('.slides');
    if (!track) return;
    const cur = block.querySelector('.cur');
    const imgs = [...track.querySelectorAll('img')];
    const current = () => {
      if (track.scrollLeft + track.clientWidth >= track.scrollWidth - 4) return imgs.length - 1;
      const left = track.scrollLeft + 24;
      return Math.max(0, imgs.findIndex(img => img.offsetLeft + img.offsetWidth / 2 > left));
    };
    track.addEventListener('scroll', () => { cur.textContent = pad(current() + 1); }, { passive: true });
    const go = d => {
      const i = Math.min(imgs.length - 1, Math.max(0, current() + d));
      track.scrollTo({ left: imgs[i].offsetLeft - 24, behavior: 'smooth' });
    };
    block.querySelector('.prev').addEventListener('click', () => go(-1));
    block.querySelector('.nxt').addEventListener('click', () => go(1));
    track.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') { e.preventDefault(); go(1); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); go(-1); }
    });

    let down = false, startX = 0, startLeft = 0;
    track.addEventListener('pointerdown', e => {
      if (e.pointerType !== 'mouse') return;
      down = true; startX = e.clientX; startLeft = track.scrollLeft;
      track.style.scrollSnapType = 'none'; track.style.cursor = 'grabbing';
    });
    window.addEventListener('pointermove', e => { if (down) track.scrollLeft = startLeft - (e.clientX - startX); });
    window.addEventListener('pointerup', () => {
      if (!down) return;
      down = false; track.style.scrollSnapType = ''; track.style.cursor = '';
    });
  });

  // Menu
  const pill = document.querySelector('.menu-pill');
  const overlay = document.querySelector('.overlay');
  const setMenu = open => {
    document.body.classList.toggle('menu-open', open);
    pill.textContent = open ? 'Close' : 'Menu';
    pill.setAttribute('aria-expanded', open);
    overlay.setAttribute('aria-hidden', !open);
  };
  pill.addEventListener('click', () => setMenu(!document.body.classList.contains('menu-open')));
  document.addEventListener('keydown', e => { if (e.key === 'Escape') setMenu(false); });
</script>
</body>
</html>
